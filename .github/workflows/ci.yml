name: CI

# This repository had NO pull-request CI at all: deploy-pages.yml runs only on
# push to main, so nothing checked a PR. That is what this file fixes.
#
# The job set is FIXED. What moves is `bundler` in apps.manifest.json, which
# these jobs read: an app joins the Vite-only checks by flipping one field in
# the commit that migrates it. Nobody edits a workflow, and nobody edits a
# required-checks list.

# BOTH long-lived branches. `development` is the default branch and where PRs
# actually go; `main` is the Pages release branch that deploy-pages.yml
# publishes from. Listing only one of them would leave the other unchecked.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancel superseded runs on rapid pushes, but let every push to the long-lived
# branches run to completion so each merged commit keeps a full CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

jobs:
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate apps.manifest.json
        run: npm run manifest:validate

  check-imports:
    name: Check imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vite apps only. The ~90 banned MUI subpath imports are rewritten with
      # each app's migration, so this is inert until the first `bundler` flips.
      - run: npm run check:imports

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The apps resolve @cytoscape-web/app-runtime through a workspace link, but
      # what they import is its dist/ — `./vite` for the config, `./meta` for the
      # virtual-module declarations. A link without a build is a directory with
      # no entry points, so this job fails on TS2688 without it.
      #
      # build:sdk rather than build: only the two packages are needed, not five
      # app bundles.
      - run: npm run build:sdk
      # Always all apps. tsc --noEmit works on a Webpack app and a Vite app
      # alike, so there is no reason to stage it — and it replaces the type
      # safety ts-loader was providing once that goes away.
      - run: npm run typecheck

  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # SAME JOB as the build, deliberately: the verifier reads each app's
      # dist/, and dist/ does not survive a job boundary. A separate verify job
      # would silently verify nothing. The verifier itself skips Webpack apps —
      # asserting an ESM remoteEntry.js against a `var` library fails by
      # construction, which is the regression check working as designed.
      - run: npm run verify:federation

  scaffold:
    name: Scaffold & verify a generated app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:sdk
      # From PACKED TARBALLS, into a directory outside the repository. Running
      # the scaffolder in place would resolve the SDK through the workspace
      # symlink and prove nothing about what a user installs — the risk being
      # exactly that the published package is missing a file the workspace had.
      # Every script a generated project ships is run here, `test` included.
      # The smoke test is part of what the scaffolder emits: if it does not
      # pass, every project created from this template starts with a red
      # `npm test`, and the developer's first impression is that the tool is
      # broken. It went unrun through Phase 5 and is the reason this line exists.
      - name: Scaffold every template, then build, verify, typecheck and test it
        run: |
          set -euo pipefail
          # The SDK is still packed, though nothing installs it here: `npm pack`
          # runs prepack, so a broken build or a `files` entry that no longer
          # matches fails in this job rather than at release time.
          npm pack -w @cytoscape-web/app-runtime --pack-destination /tmp
          npm pack -w create-cytoscape-app --pack-destination /tmp
          CREATE=$(ls /tmp/create-cytoscape-app-*.tgz)
          WORK=$(mktemp -d)
          cd "$WORK"
          npm install --silent "$CREATE"
          for T in panel menu context-menu non-react full; do
            echo "── $T ──"
            node node_modules/create-cytoscape-app/dist/index.js "app-$T" --yes \
              --id "app${T//-/}" --template "$T" --port "$((6400 + RANDOM % 100))" --no-install
            cd "app-$T"
            # Resolve @cytoscape-web/app-runtime from npm, because that is
            # what a generated project actually depends on.
            #
            # Except during the commit that raises the pin. Then the version
            # scaffolds ask for does not exist on the registry yet, and this
            # job would demand a publish that cannot happen until this job
            # passes. The fallback is not a workaround for that deadlock so
            # much as the same intent at a different moment: what a user gets
            # after the release is the tarball built above.
            #
            # Loud on purpose. A silent fallback would also hide a publish that
            # simply failed, which looks identical from here.
            PINNED=$(node -p "require('./package.json').devDependencies['@cytoscape-web/app-runtime']")
            if npm view "@cytoscape-web/app-runtime@$PINNED" version >/dev/null 2>&1; then
              npm install --silent
            else
              echo "::notice::app-runtime@$PINNED is not on the registry yet — installing the tarball built in this job. Expected only on a version-bump commit."
              npm install --silent "$(ls /tmp/cytoscape-web-app-runtime-*.tgz)"
              npm install --silent
            fi

            # Note the asymmetry that remains, deliberately: the SCAFFOLDER is
            # installed from its tarball above, because a change to it in this
            # PR is exactly what this job exists to test.
            npm run build
            npx cyweb-app verify
            npm run typecheck
            npm test
            cd ..
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The apps resolve @cytoscape-web/app-runtime through a workspace link, but
      # what they import is its dist/ — `./vite` for the config, `./meta` for the
      # virtual-module declarations. A link without a build is a directory with
      # no entry points, so this job fails on ERR_MODULE_NOT_FOUND and
      # TS2688 without it.
      #
      # build:sdk rather than build: only the two packages are needed, not five
      # app bundles.
      - run: npm run build:sdk
      # --if-present: an app joins the test scope by gaining a `test` script in
      # its migration commit. No workflow edit, nothing to forget.
      - run: npm run test
