name: CI

# This repository had NO pull-request CI at all: deploy-pages.yml runs only on
# push to main, so nothing checked a PR. That is what this file fixes.
#
# The job set is FIXED. What moves is `bundler` in apps.manifest.json, which
# these jobs read: an app joins the Vite-only checks by flipping one field in
# the commit that migrates it. Nobody edits a workflow, and nobody edits a
# required-checks list.

# BOTH long-lived branches. `development` is the default branch and where PRs
# actually go; `main` is the Pages release branch that deploy-pages.yml
# publishes from. Listing only one of them would leave the other unchecked.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancel superseded runs on rapid pushes, but let every push to the long-lived
# branches run to completion so each merged commit keeps a full CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

jobs:
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate apps.manifest.json
        run: npm run manifest:validate

  check-imports:
    name: Check imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vite apps only. The ~90 banned MUI subpath imports are rewritten with
      # each app's migration, so this is inert until the first `bundler` flips.
      - run: npm run check:imports

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The apps resolve @cytoscape-web/app-runtime through a workspace link, but
      # what they import is its dist/ — `./vite` for the config, `./meta` for the
      # virtual-module declarations. A link without a build is a directory with
      # no entry points, so this job fails on TS2688 without it.
      #
      # build:sdk rather than build: only the two packages are needed, not five
      # app bundles.
      - run: npm run build:sdk
      # Always all apps. tsc --noEmit works on a Webpack app and a Vite app
      # alike, so there is no reason to stage it — and it replaces the type
      # safety ts-loader was providing once that goes away.
      - run: npm run typecheck

  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # SAME JOB as the build, deliberately: the verifier reads each app's
      # dist/, and dist/ does not survive a job boundary. A separate verify job
      # would silently verify nothing. The verifier itself skips Webpack apps —
      # asserting an ESM remoteEntry.js against a `var` library fails by
      # construction, which is the regression check working as designed.
      - run: npm run verify:federation

  scaffold:
    name: Scaffold & verify a generated app (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # BOTH package managers. `--pm npm|pnpm` is a formally supported option and
    # packed-tarball acceptance under both is already one of the SDK design's
    # criteria — but only npm was ever exercised here. pnpm's layout is the
    # highest-risk part of runtime-plugin resolution: the path is interpolated
    # into a generated `import "<path>"`, and a store layout that resolved it
    # outside the installed package would fail silently at load time.
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - run: npm run build:sdk
      # From PACKED TARBALLS, into a directory outside the repository. Running
      # the scaffolder in place would resolve the SDK through the workspace
      # symlink and prove nothing about what a user installs — the risk being
      # exactly that the published package is missing a file the workspace had.
      # Every script a generated project ships is run here, `test` included.
      # The smoke test is part of what the scaffolder emits: if it does not
      # pass, every project created from this template starts with a red
      # `npm test`, and the developer's first impression is that the tool is
      # broken. It went unrun through Phase 5 and is the reason this line exists.
      - name: Scaffold every template, then build, verify, typecheck and test it
        run: |
          set -euo pipefail
          # The SDK is still packed, though nothing installs it here: `npm pack`
          # runs prepack, so a broken build or a `files` entry that no longer
          # matches fails in this job rather than at release time.
          npm pack -w @cytoscape-web/app-runtime --pack-destination /tmp
          npm pack -w create-cytoscape-app --pack-destination /tmp
          CREATE=$(ls /tmp/create-cytoscape-app-*.tgz)
          WORK=$(mktemp -d)
          cd "$WORK"
          ${{ matrix.pm }} install --silent "$CREATE"
          PM=${{ matrix.pm }}
          for T in panel menu context-menu non-react full; do
            echo "── $T ──"
            node node_modules/create-cytoscape-app/dist/index.js "app-$T" --yes \
              --id "app${T//-/}" --template "$T" --port "$((6400 + RANDOM % 100))" \
              --pm "${{ matrix.pm }}" --no-install
            cd "app-$T"
            # Resolve @cytoscape-web/app-runtime from npm, because that is
            # what a generated project actually depends on.
            #
            # Except during the commit that raises the pin. Then the version
            # scaffolds ask for does not exist on the registry yet, and this
            # job would demand a publish that cannot happen until this job
            # passes. The fallback is not a workaround for that deadlock so
            # much as the same intent at a different moment: what a user gets
            # after the release is the tarball built above.
            #
            # Loud on purpose. A silent fallback would also hide a publish that
            # simply failed, which looks identical from here.
            # ALWAYS the candidate built in this job, never whatever the
            # registry happens to have. The previous version installed the
            # registry copy whenever the generated range already resolved, so an
            # ordinary SDK change could pass this job while exercising code
            # published weeks ago — the one thing a pre-publish gate must not do.
            RUNTIME_TGZ=$(ls /tmp/cytoscape-web-app-runtime-*.tgz)
            $PM install --silent "$RUNTIME_TGZ"
            $PM install --silent

            # A version string can be printed by anything. Assert the binary
            # that runs is the one inside this project's node_modules.
            RESOLVED=$(node -p "require.resolve('@cytoscape-web/app-runtime/package.json')")
            case "$RESOLVED" in
              "$PWD"/node_modules/*) ;;
              *) echo "::error::app-runtime resolved to $RESOLVED, outside the generated project"; exit 1 ;;
            esac
            EXPECTED=$(node -p "require('$RESOLVED').version")
            ACTUAL=$(npx cyweb-app --version)
            [ "$EXPECTED" = "$ACTUAL" ] || {
              echo "::error::cyweb-app reports $ACTUAL, installed runtime is $EXPECTED"; exit 1
            }

            # pnpm keeps real packages under a store and links them in. The
            # runtime plugin path is interpolated into a generated import, so it
            # has to resolve INSIDE the installed package — a path that escaped
            # it would fail silently at load time, which is why this is asserted
            # rather than assumed.
            npm run build
            node -e "
              const m = require('fs').readFileSync('dist/mf-manifest.json', 'utf8')
              const plugin = JSON.parse(m).configuredRuntimePlugins[0]
              if (!plugin.includes('app-runtime')) {
                console.error('::error::runtime plugin resolved to ' + plugin)
                process.exit(1)
              }
            "

            # Note the asymmetry that remains, deliberately: the SCAFFOLDER is
            # installed from its tarball above, because a change to it in this
            # PR is exactly what this job exists to test.
            npx cyweb-app verify
            npm run typecheck
            npm test

            # The submission path, end to end: build the archive and read the
            # manifest back out of it. A standalone project is where adm-zip
            # being an optional peer actually bites.
            npm run build:zip
            node -e "
              const AdmZip = require('adm-zip')
              const fs = require('fs')
              const zip = fs.readdirSync('.').find((f) => f.endsWith('.zip'))
              if (!zip) { console.error('::error::build:zip wrote no archive'); process.exit(1) }
              const names = new AdmZip(zip).getEntries().map((e) => e.entryName)
              const manifest = JSON.parse(new AdmZip(zip).readAsText('cy-manifest.json'))
              const id = require('./package.json').cyweb.id
              if (manifest.id !== id) {
                console.error('::error::manifest id ' + manifest.id + ' != ' + id); process.exit(1)
              }
              if (names.filter((n) => n === 'remoteEntry.js').length !== 1) {
                console.error('::error::archive has no single root remoteEntry.js'); process.exit(1)
              }
              if (names.some((n) => n.endsWith('.html') || n.endsWith('.map'))) {
                console.error('::error::archive carries HTML or a source map'); process.exit(1)
              }
              console.log('archive ok: ' + names.length + ' members, id ' + manifest.id)
            "
            cd ..
          done

  windows:
    name: CLI and archive on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    # Everything this covers differs from POSIX in a way no amount of Linux
    # testing reveals: `rename` over an existing file, path separators in
    # archive member names, and the order those members come out in. The
    # packager turns adm-zip's own sorting off and uses one named comparator
    # precisely so the answer is the same here as it is on Linux — which is
    # only worth claiming if it is executed here.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:sdk
      - name: Unit tests, including the CLI and archive suites
        run: npm run test -w @cytoscape-web/app-runtime
      - name: Build an archive and read its member order back
        run: npm run build:zip -w @cytoscape-web/hello-world
      - name: Members are POSIX paths in unsigned UTF-8 byte order
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const AdmZip = require('adm-zip')
            const fs = require('fs')
            const zip = fs.readdirSync('hello-world').find((f) => f.endsWith('.zip'))
            const names = new AdmZip('hello-world/' + zip, { noSort: true })
              .getEntries().map((e) => e.entryName)
            if (names.some((n) => n.includes('\\\\'))) {
              console.error('::error::a member name carries a backslash'); process.exit(1)
            }
            const sorted = [...names].sort((a, b) =>
              Buffer.compare(Buffer.from(a, 'utf8'), Buffer.from(b, 'utf8')))
            if (JSON.stringify(names) !== JSON.stringify(sorted)) {
              console.error('::error::members are not in unsigned UTF-8 byte order')
              console.error(JSON.stringify(names, null, 2))
              process.exit(1)
            }
            console.log('windows archive ok: ' + names.length + ' members')
          "

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The apps resolve @cytoscape-web/app-runtime through a workspace link, but
      # what they import is its dist/ — `./vite` for the config, `./meta` for the
      # virtual-module declarations. A link without a build is a directory with
      # no entry points, so this job fails on ERR_MODULE_NOT_FOUND and
      # TS2688 without it.
      #
      # build:sdk rather than build: only the two packages are needed, not five
      # app bundles.
      - run: npm run build:sdk
      # --if-present: an app joins the test scope by gaining a `test` script in
      # its migration commit. No workflow edit, nothing to forget.
      - run: npm run test
